name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to assemble"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This action provisions Gradle itself (per gradle/wrapper/gradle-wrapper.properties)
      # and caches dependencies, so the build works without a committed gradlew jar.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode debug keystore (optional)
        if: ${{ vars.BUILD_TYPE == 'release' || github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; release build will be unsigned."
          fi

      - name: Assemble debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # KEYSTORE_PATH itself is exported to $GITHUB_ENV by the decode step above
        # (only when the secret is present), so it's already in scope here.
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate build outputs
        id: outputs
        run: |
          mkdir -p apk-output
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \;
          ls -la apk-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppTimeMachine-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
